<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .purple:hover{
            background-color: purple;
        }
        .blue:hover{
            background-color: blue;
        }
        .skyblue:hover{
            background-color: skyblue;
        }
        .gree:hover{
            background-color: rgb(0, 0, 0);
        }
        .yellow:hover{
            background-color: rgb(7, 248, 252);
        }
        .orange:hover{
            background-color: rgb(255, 222, 161);
        }
        .red:hover{
            background-color: rgb(91, 6, 92);
        }
        .pink:hover{
            background-color: rgb(233, 255, 166);
        }
        .cyan:hover{
            background-color: rgb(125, 126, 132);
        }
        table{
            margin: 50px auto;
        }
        th{
            height: 100px;
            width: 100px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th class="purple">1</th>
            <th class="blue">2</th>
            <th class="skyblue">3</th>
        </tr>
        <tr>
            <th class="green">4</th>
            <th class="yellow">5</th>
            <th class="orange">6</th>
        </tr>
        <tr>
            <th class="red">7</th>
            <th class="pink">8</th>
            <th class="cyan">9</th>
        </tr>
    </table>
</body>
</html>
