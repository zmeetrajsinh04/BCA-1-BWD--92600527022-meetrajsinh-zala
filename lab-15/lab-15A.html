<!DOCTYPE html>
<html>
<head>
    <title>Image Opacity Effect</title>

    <style>
        img {
            width: 400px;
            opacity: 1;
            transition: 0.5s;
        }

        img:hover {
            opacity: 0.4;
        }
        body{
            background-color: lightslategray;
        }
    </style>
</head>

<body>

    <h2>Mouse Hover Image</h2>

    <img src="images2.jpg " alt="My Image">
    
</body>
</html>
