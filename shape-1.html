<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rectangle Image Map</title>
</head>
<body>

    <h2>Rectangle Shape Example</h2>
    <p>Click on the designated rectangular area on the image:</p>

    <img src="d:\7022.html\Capture.PNG" alt="Sample Image" usemap="#rect-map" width="600" height="400">

    <map name="rect-map">
        
        <area shape="rect" coords="50,50,250,150" href="d:\7022.html\Capture.PNG" alt="Rectangle Area">
    </map>

</body>
</html>
