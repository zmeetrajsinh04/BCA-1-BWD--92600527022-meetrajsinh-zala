<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyramid Pattern using While Loop</title>
</head>
<body>
    <pre id="pyramidDisplay"></pre>

    <script>
        let rows = 5;
        let i = 1;
        let pyramidOutput = "";

        while (i <= rows) {
            let spaces = " ".repeat(rows - i);
            let stars = "*".repeat(2 * i - 1);
            pyramidOutput += spaces + stars + "\n";
            console.log(spaces + stars);
            
            i++;
        }
        document.getElementById("pyramidDisplay").textContent = pyramidOutput;
    </script>

</body>
</html>
